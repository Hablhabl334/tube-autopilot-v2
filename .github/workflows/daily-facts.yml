name: daily-facts

on:
  schedule:
    - cron: "05 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render but don't upload"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-facts
  cancel-in-progress: false

jobs:
  produce:
    name: Fact Vault daily post
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_KEY_FACTS || secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID_FACTS: ${{ secrets.YT_CLIENT_ID_FACTS || secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET_FACTS: ${{ secrets.YT_CLIENT_SECRET_FACTS || secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_FACTS: ${{ secrets.YT_REFRESH_TOKEN_FACTS }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      # ONE repository secret (FACTORY_ENV) carries all channel credentials.
      # The pipeline's config loader reads this .env file at import time.
      # (The per-secret env vars above still work if you prefer setting
      # them individually - env vars win, .env fills the gaps.)
      - name: Load channel secrets
        env:
          FACTORY_ENV: ${{ secrets.FACTORY_ENV }}
        run: printf '%s\n' "$FACTORY_ENV" > .env

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ubuntu-latest runners ship NO ffmpeg -> install it, and
          # imageio-ffmpeg (pip) is the built-in fallback either way
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -c "from src.utils import ffmpeg_exe; print('ffmpeg ready:', ffmpeg_exe())"

      - name: Run pipeline — facts
        run: python main.py --channel facts

      - name: Save topic history + bias
        if: success() && github.event.inputs.dry_run != 'true'
        run: bash scripts/push_history.sh facts

      - name: Upload artifacts (video + thumbnail + script)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-facts
          path: |
            work/facts/**/*.mp4
            work/facts/**/*.jpg
            work/facts/**/script.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Alert — create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="The daily run for **facts** failed.
          Inspect the full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          _Auto-generated by tube-autopilot._"
          gh issue create \
            --title "❌ facts pipeline failed (run ${{ github.run_id }})" \
            --body "$BODY" || true
