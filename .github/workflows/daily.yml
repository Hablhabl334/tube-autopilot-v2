name: daily-video

on:
  schedule:
    - cron: "0 12 * * *"          # every day 12:00 UTC (≈ 8am New York / 8pm Beijing)
  workflow_dispatch:
    inputs:
      channel:
        description: "Run a single channel (empty = all)"
        type: choice
        options: ["", mindset, facts, tech, money]
        default: ""
      dry_run:
        description: "Render but don't upload"
        type: boolean
        default: false

permissions:
  contents: write    # push topic history back
  issues: write      # auto-create failure alerts

jobs:
  # GitHub Actions does not allow `matrix` inside a job-level `if:` (it is
  # evaluated before matrix expansion — "Unrecognized named-value: 'matrix'").
  # So a tiny plan job computes the channel list first, and the produce
  # matrix below consumes it with fromJSON(). Same behavior as intended:
  # scheduled/empty dispatch = all 4 channels; a channel picked in the
  # dispatch form = only that channel.
  plan:
    name: Decide channels for this run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channels: ${{ steps.set.outputs.channels }}
    steps:
      - name: Compute the channel list
        id: set
        run: |
          CH='${{ github.event.inputs.channel }}'
          if [ -z "$CH" ] || [ "$CH" = "all" ]; then
            echo 'channels=["mindset","facts","tech","money"]' >> "$GITHUB_OUTPUT"
            echo "This run: all 4 channels."
          else
            echo "channels=[\"$CH\"]" >> "$GITHUB_OUTPUT"
            echo "This run: only '$CH'."
          fi

  produce:
    name: ${{ matrix.channel }} Short
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: daily-${{ matrix.channel }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ffmpeg -version | head -1

      - name: Stagger start (avoids history-push collisions)
        run: sleep $((RANDOM % 150))

      - name: Run pipeline — ${{ matrix.channel }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_MINDSET: ${{ secrets.YT_REFRESH_TOKEN_MINDSET }}
          YT_REFRESH_TOKEN_FACTS: ${{ secrets.YT_REFRESH_TOKEN_FACTS }}
          YT_REFRESH_TOKEN_TECH: ${{ secrets.YT_REFRESH_TOKEN_TECH }}
          YT_REFRESH_TOKEN_MONEY: ${{ secrets.YT_REFRESH_TOKEN_MONEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python main.py --channel ${{ matrix.channel }}

      - name: Save topic history
        if: success() && github.event.inputs.dry_run != 'true'
        run: bash scripts/push_history.sh ${{ matrix.channel }}

      - name: Upload artifacts (video + thumbnail + script)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.channel }}
          path: |
            work/${{ matrix.channel }}/**/*.mp4
            work/${{ matrix.channel }}/**/*.jpg
            work/${{ matrix.channel }}/**/script.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Alert — create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="The daily run for **${{ matrix.channel }}** failed.
          Inspect the full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          _Auto-generated by tube-autopilot._"
          gh issue create \
            --title "❌ ${{ matrix.channel }} pipeline failed (run ${{ github.run_id }})" \
            --body "$BODY" || true
