name: verify-token

# The "does my forever token still work?" test.
# Actions tab → verify-token → Run workflow.
#   - green ✅  every credential that is present verified OK
#   - green ✅  no credentials yet → "nothing to verify yet" (fine)
#   - red   ❌  a credential is present but broken (revoked token, wrong
#                secret, quota) — the log says exactly which one and why
#
# Reads BOTH secret styles:
#   FACTORY_ENV            (one multiline secret holding all KEY=VALUE lines)
#   YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN_<CHANNEL>
#   YT_CLIENT_ID_<CHANNEL> / YT_CLIENT_SECRET_<CHANNEL> (per-channel clients)
#
# Total quota cost: 1 unit per checked credential set. Nothing else.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Check one channel only (empty = everything)"
        type: choice
        options: ["", mindset, facts, tech, money]
        default: ""

permissions:
  contents: read

concurrency:
  group: verify-token
  cancel-in-progress: false

jobs:
  verify:
    name: YouTube credential check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests (light — the checker is standalone)
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Load FACTORY_ENV secret into .env (if set)
        env:
          FACTORY_ENV: ${{ secrets.FACTORY_ENV }}
        run: |
          if [ -n "$FACTORY_ENV" ]; then
            printf '%s\n' "$FACTORY_ENV" > .env
            echo "FACTORY_ENV secret found — credentials loaded from it."
          else
            echo "FACTORY_ENV not set — will check individual secrets instead."
          fi

      - name: Verify credentials
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID_MINDSET: ${{ secrets.YT_CLIENT_ID_MINDSET }}
          YT_CLIENT_SECRET_MINDSET: ${{ secrets.YT_CLIENT_SECRET_MINDSET }}
          YT_REFRESH_TOKEN_MINDSET: ${{ secrets.YT_REFRESH_TOKEN_MINDSET }}
          YT_CLIENT_ID_FACTS: ${{ secrets.YT_CLIENT_ID_FACTS }}
          YT_CLIENT_SECRET_FACTS: ${{ secrets.YT_CLIENT_SECRET_FACTS }}
          YT_REFRESH_TOKEN_FACTS: ${{ secrets.YT_REFRESH_TOKEN_FACTS }}
          YT_CLIENT_ID_TECH: ${{ secrets.YT_CLIENT_ID_TECH }}
          YT_CLIENT_SECRET_TECH: ${{ secrets.YT_CLIENT_SECRET_TECH }}
          YT_REFRESH_TOKEN_TECH: ${{ secrets.YT_REFRESH_TOKEN_TECH }}
          YT_CLIENT_ID_MONEY: ${{ secrets.YT_CLIENT_ID_MONEY }}
          YT_CLIENT_SECRET_MONEY: ${{ secrets.YT_CLIENT_SECRET_MONEY }}
          YT_REFRESH_TOKEN_MONEY: ${{ secrets.YT_REFRESH_TOKEN_MONEY }}
          CHANNEL_ARG: ${{ github.event.inputs.channel }}
        run: python tools/check_token.py ${CHANNEL_ARG:+--channel "$CHANNEL_ARG"}
