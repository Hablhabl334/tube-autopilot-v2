name: daily-video

on:
  schedule:
    - cron: "0 12 * * *"          # every day 12:00 UTC (≈ 8am New York / 8pm Beijing)
  workflow_dispatch:
    inputs:
      channel:
        description: "Run a single channel (empty = all)"
        type: choice
        options: ["", mindset, facts, tech, money]
        default: ""
      dry_run:
        description: "Render but don't upload"
        type: boolean
        default: false

permissions:
  contents: write    # push topic history back
  issues: write      # auto-create failure alerts

jobs:
  produce:
    name: ${{ matrix.channel }} Short
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: daily-${{ matrix.channel }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        channel: [mindset, facts, tech, money]
    # when manually dispatched with one channel, run only that one
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.channel == '' ||
      github.event.inputs.channel == matrix.channel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ffmpeg -version | head -1

      - name: Stagger start (avoids history-push collisions)
        run: sleep $((RANDOM % 150))

      - name: Run pipeline — ${{ matrix.channel }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_MINDSET: ${{ secrets.YT_REFRESH_TOKEN_MINDSET }}
          YT_REFRESH_TOKEN_FACTS: ${{ secrets.YT_REFRESH_TOKEN_FACTS }}
          YT_REFRESH_TOKEN_TECH: ${{ secrets.YT_REFRESH_TOKEN_TECH }}
          YT_REFRESH_TOKEN_MONEY: ${{ secrets.YT_REFRESH_TOKEN_MONEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python main.py --channel ${{ matrix.channel }}

      - name: Save topic history
        if: success() && github.event.inputs.dry_run != 'true'
        run: bash scripts/push_history.sh ${{ matrix.channel }}

      - name: Upload artifacts (video + thumbnail + script)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.channel }}
          path: |
            work/${{ matrix.channel }}/**/*.mp4
            work/${{ matrix.channel }}/**/*.jpg
            work/${{ matrix.channel }}/**/script.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Alert — create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="The daily run for **${{ matrix.channel }}** failed.
          Inspect the full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          _Auto-generated by tube-autopilot._"
          gh issue create \
            --title "❌ ${{ matrix.channel }} pipeline failed (run ${{ github.run_id }})" \
            --body "$BODY" || true
